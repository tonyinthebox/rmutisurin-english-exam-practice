# สร้างไฟล์เสียง Listening และเผยแพร่เว็บไซต์บน GitHub Pages อัตโนมัติ
# ทำงานทุกครั้งที่มีการแก้ไขในสาขา main หรือกดรันเองจากแท็บ Actions
name: Build audio & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "สร้างไฟล์เสียงใหม่ทั้งหมด"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ตรวจไฟล์ข้อสอบ
        run: python scripts/validate.py

      - name: ติดตั้งเครื่องมือสร้างเสียง
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts

      - name: สร้างไฟล์เสียงที่เพิ่ม/แก้ไข
        run: python scripts/build_audio.py ${{ inputs.force && '--force' || '' }}

      - name: บันทึกไฟล์เสียงกลับเข้า repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "ไม่มีไฟล์เสียงใหม่"
          else
            git commit -m "Build listening audio [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
